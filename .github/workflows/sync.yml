name: Sync WeChat articles
on:
  schedule:
    - cron: "15 1,10 * * *" # 09:15 and 18:15 Asia/Shanghai (UTC+8)
    - cron: "30 19 * * 6"   # Sunday 03:30 Asia/Shanghai compensation run
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Run idempotent synchronization
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STORAGE_DIR: ./data/storage
          SYNC_ADAPTER: http
          SYNC_API_BASE_URL: ${{ secrets.SYNC_API_BASE_URL }}
          SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN }}
        run: python -m app.cli sync --trigger github-actions

