<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172a25">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}专业、审慎、以客户为中心的法律服务。{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/site.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="top-rule"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="{{ site_name }}首页">
      <span class="brand-mark">衡</span>
      <span><b>{{ site_name }}</b><small>HENGZHENG LAW FIRM</small></span>
    </a>
    <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">菜单</button>
    <nav class="site-nav" aria-label="主导航">
      <a href="/about">关于我们</a><a href="/practice">专业领域</a>
      <a href="/team">律师团队</a><a href="/articles">洞见文章</a><a href="/contact">联系我们</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div>
      <div class="footer-brand">{{ site_name }}</div>
      <p>以严谨回应复杂，以长期主义守护每一次托付。</p>
    </div>
    <div class="footer-links"><a href="/about">律所介绍</a><a href="/articles">专业洞见</a><a href="/contact">联系咨询</a></div>
    <div class="footer-meta">© 2026 {{ site_name }}<br>本网站内容不构成法律意见</div>
  </footer>
  <script src="{{ url_for('static', path='/js/site.js') }}" defer></script>
</body>
</html>
